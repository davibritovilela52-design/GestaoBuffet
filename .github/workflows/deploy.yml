name: Deploy to Windows VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy via Native SSH/SCP
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_RAW_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          # 1. Limpar o Host de caracteres invisíveis
          SSH_HOST=$(echo "$SSH_RAW_HOST" | tr -d '\r\n ')
          echo "Conectando ao host sanitizado..."

          # 2. Configurar a chave SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 3. Adicionar o host aos conhecidos (usando o IP direto)
          ssh-keyscan -v -t rsa "$SSH_HOST" >> ~/.ssh/known_hosts
          
          # 4. Transferir arquivos
          echo "Iniciando transferência..."
          scp -v -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -r dist/* "$SSH_USER@$SSH_HOST:C:/inetpub/wwwroot/GestaoBuffet"
          
          # 5. Reiniciar via SSH
          echo "Reiniciando aplicação..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "cd C:\\inetpub\\wwwroot\\GestaoBuffet && pm2 restart gestao-buffet || pm2 start \"serve -s . -p 80\" --name \"gestao-buffet\" && pm2 save"
