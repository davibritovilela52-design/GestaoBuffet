name: Deploy to Windows VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy via Native SSH/SCP
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          # 1. Configurar a chave SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Adicionar o host aos conhecidos para evitar o prompt de confirmação
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          
          # 3. Transferir arquivos usando SCP manual (mais logs)
          echo "Iniciando transferência dos arquivos..."
          scp -v -i ~/.ssh/id_rsa -r dist/* "$SSH_USER@$SSH_HOST:C:/inetpub/wwwroot/GestaoBuffet"
          
          # 4. Reiniciar via SSH manual
          echo "Reiniciando aplicação no servidor..."
          ssh -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "cd C:\\inetpub\\wwwroot\\GestaoBuffet && pm2 restart gestao-buffet || pm2 start \"serve -s . -p 80\" --name \"gestao-buffet\" && pm2 save"
